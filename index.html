<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ITパスポート試験の用語を、ゲーム感覚で楽しく覚えられる学習サイト">
  <meta name="theme-color" content="#4f46e5">
  <title>ITパス ゲームラボ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
/* =========================================================
   ITパス ゲームラボ  スタイル
   色を変えたいときは :root の変数を編集してください
   ========================================================= */
:root {
  --bg: #f6f5fb;
  --surface: #ffffff;
  --surface-2: #f0eef8;
  --text: #1f1d2b;
  --muted: #6b6880;
  --line: #e4e1ef;
  --primary: #4f46e5;
  --primary-ink: #ffffff;
  --primary-soft: #eceafd;

  --s: #f08a24;  --s-soft: #fff1e3;  --s-ink: #9a4d00;   /* ストラテジ */
  --m: #16a37f;  --m-soft: #e0f6ef;  --m-ink: #0b6b52;   /* マネジメント */
  --t: #2f7de1;  --t-soft: #e3effd;  --t-ink: #144f9c;   /* テクノロジ */
  --e: #d6336c;  --e-soft: #fde6ef;  --e-ink: #9c1c4b;   /* セキュリティ・倫理（次年度以降版） */
  --new: #0f9d8a;
  --calc: #8b5cf6; --calc-soft: #f0e9ff; --calc-ink: #5b2fc4;

  --ok: #16a34a;  --ok-soft: #dcfce7;
  --ng: #e11d48;  --ng-soft: #ffe4ea;

  --radius: 18px;
  --shadow: 0 1px 2px rgba(30, 20, 80, .06), 0 8px 24px rgba(30, 20, 80, .07);
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14131c;
    --surface: #1e1c2a;
    --surface-2: #282636;
    --text: #eeedf5;
    --muted: #a3a0b8;
    --line: #34314a;
    --primary: #8b84ff;
    --primary-ink: #15132a;
    --primary-soft: #2a2752;
    --s-soft: #3a2a19; --s-ink: #ffb46b;
    --m-soft: #15342b; --m-ink: #5fe0bb;
    --t-soft: #172a45; --t-ink: #8cc0ff;
    --e-soft: #3d1a2a; --e-ink: #ff8fb7;
    --new: #3fd1bd;
    --calc-soft: #2c2245; --calc-ink: #c4a8ff;
    --ok-soft: #133524; --ng-soft: #3d1724;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
h1, h2 { line-height: 1.3; margin: 0; }
[hidden] { display: none !important; }
#app { max-width: 720px; margin: 0 auto; padding: 16px 16px 64px; outline: none; }

/* ---------- ヘッダー ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; text-decoration: none; font-size: 16px; }
.brand-mark {
  display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(135deg, var(--s), var(--m) 50%, var(--t));
  color: #fff; font-size: 12px; letter-spacing: .5px;
}
.top-right { display: flex; align-items: center; gap: 8px; }
.mode-chip {
  text-decoration: none; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px;
  background: var(--primary-soft); color: var(--primary); white-space: nowrap;
}
.mode-chip.mode-next { background: var(--e-soft); color: var(--e-ink); }
.brand { white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.topbar { gap: 8px; }
.top-right { flex: none; }
.review-link { white-space: nowrap; }
@media (max-width: 480px) { .review-text { display: none; } }
@media (max-width: 360px) { .brand-text { display: none; } }
.filter-label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin: 0 0 6px; }
.review-link {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-size: 14px; font-weight: 700;
}
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--ng); color: #fff; font-size: 12px; display: inline-grid; place-items: center; }

/* ---------- 共通パーツ ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
.panel h2 { font-size: 15px; margin-bottom: 10px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.center { text-align: center; }
.section-title { font-size: 17px; margin: 24px 4px 12px; }

.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag-s { background: var(--s-soft); color: var(--s-ink); }
.tag-m { background: var(--m-soft); color: var(--m-ink); }
.tag-t { background: var(--t-soft); color: var(--t-ink); }
.tag-calc { background: var(--calc-soft); color: var(--calc-ink); }
.tag-e { background: var(--e-soft); color: var(--e-ink); }
.tag-new { background: transparent; color: var(--new); border: 1.5px solid var(--new); padding: 1px 6px; font-size: 10px; letter-spacing: .05em; }
.muted { color: var(--muted); font-weight: 400; font-size: 12px; }
.chip small { font-size: 11px; opacity: .65; font-weight: 700; margin-left: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 48px; padding: 10px 18px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px;
  text-decoration: none; cursor: pointer; transition: transform .1s ease, background .2s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
.btn-ghost { background: transparent; }
.btn-block { width: 100%; margin-top: 18px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }
.btn-row.left { justify-content: flex-start; margin: 4px 0 14px; }
.link-btn { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 8px; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip {
  padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface);
  font-size: 14px; font-weight: 700; cursor: pointer; min-height: 40px;
}
.chip.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.chip-review.on { border-color: var(--ng); background: var(--ng-soft); color: var(--ng); }

.progress-line { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 6px 0 12px; }
.progress-line span { display: block; height: 100%; background: var(--primary); border-radius: inherit; transition: width .3s ease; }
.counter { font-size: 13px; font-weight: 700; color: var(--muted); }

#toast {
  position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 50;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
  font-size: 14px; font-weight: 700; transition: all .25s ease; max-width: calc(100% - 32px); text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.ng { background: var(--ng); color: #fff; }

/* ---------- ホーム ---------- */
.hero { padding: 20px 4px 8px; }
.hero-kicker { margin: 0 0 6px; color: var(--primary); font-weight: 800; font-size: 13px; letter-spacing: .1em; }
.hero h1 { font-size: clamp(26px, 7vw, 36px); font-weight: 800; }
.hero-sub { color: var(--muted); margin: 10px 0 18px; font-size: 14px; }

.progress-panel .panel-head h2 { margin: 0; }
.big-pct { font-size: 30px; font-weight: 800; color: var(--primary); }
.big-pct small { font-size: 15px; }
.gauge { margin-top: 12px; }
.gauge-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.gauge-label { font-weight: 800; }
.gauge-label.s { color: var(--s-ink); } .gauge-label.m { color: var(--m-ink); } .gauge-label.t { color: var(--t-ink); } .gauge-label.e { color: var(--e-ink); }
.gauge-num { color: var(--muted); }
.gauge-num b { color: var(--text); font-size: 15px; }
.gauge-bar { display: flex; height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.gauge-bar span { height: 100%; transition: width .6s ease; }
.seg-m.s { background: var(--s); } .seg-m.m { background: var(--m); } .seg-m.t { background: var(--t); } .seg-m.e { background: var(--e); }
.seg-l.e { background: color-mix(in srgb, var(--e) 35%, transparent); }
.seg-l.s { background: color-mix(in srgb, var(--s) 35%, transparent); }
.seg-l.m { background: color-mix(in srgb, var(--m) 35%, transparent); }
.seg-l.t { background: color-mix(in srgb, var(--t) 35%, transparent); }
.legend { font-size: 12px; color: var(--muted); margin: 14px 0 0; }
.lg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.lg-m { background: var(--muted); } .lg-l { background: color-mix(in srgb, var(--muted) 35%, transparent); }

/* 試験の版の切り替え */
.mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .mode-switch { grid-template-columns: 1fr; } }
.mode-opt {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
  padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); cursor: pointer;
}
.mode-opt.on { border-color: var(--primary); background: var(--primary-soft); }
.mode-name { font-weight: 800; font-size: 15px; }
.mode-opt.on .mode-name::before { content: "✓ "; color: var(--primary); }
.mode-exam { font-size: 12px; color: var(--muted); }
.mode-cats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }

.game-card-dict { border-style: dashed; }

.review-banner {
  display: flex; align-items: center; gap: 12px; text-decoration: none;
  background: var(--ng-soft); border: 1px solid color-mix(in srgb, var(--ng) 30%, transparent);
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px;
}
.review-banner small { color: var(--muted); }
.rb-icon { font-size: 26px; }
.rb-arrow { margin-left: auto; font-size: 26px; color: var(--ng); }

.game-grid { display: grid; gap: 12px; }
@media (min-width: 640px) { .game-grid { grid-template-columns: 1fr 1fr; } }
.game-card {
  display: flex; align-items: center; gap: 14px; text-decoration: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s;
}
.game-card:hover { transform: translateY(-2px); border-color: var(--primary); }
.gc-icon { font-size: 30px; width: 54px; height: 54px; flex: none; display: grid; place-items: center; background: var(--surface-2); border-radius: 14px; }
.gc-body { display: flex; flex-direction: column; min-width: 0; }
.gc-name { font-weight: 800; font-size: 16px; }
.gc-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
.gc-time { margin-left: auto; flex: none; font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-soft); padding: 3px 8px; border-radius: 999px; align-self: flex-start; }

.foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 32px; }
.foot p { margin: 2px 0; }

/* ---------- ゲーム共通 ---------- */
.game-head { display: flex; align-items: flex-start; gap: 12px; margin: 4px 0 16px; }
.game-head h1 { font-size: 20px; font-weight: 800; }
.game-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.back {
  flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); text-decoration: none; font-size: 24px; line-height: 1;
}
.setup h2 { margin-top: 4px; }
.result { text-align: center; }
.result-big { font-size: 56px; font-weight: 800; color: var(--primary); line-height: 1.1; }
.result-big small { font-size: 20px; color: var(--muted); }
.result-sub { font-weight: 700; margin: 8px 0 0; }
.result-msg { color: var(--muted); font-size: 14px; }
.badge-new { display: inline-block; background: #facc15; color: #422006; font-weight: 800; font-size: 13px; padding: 4px 12px; border-radius: 999px; margin-bottom: 8px; animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(.5); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

.term-list { list-style: none; margin: 0; padding: 0; }
.term-list li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.term-list li:first-child { border-top: none; }
.term-list li b { font-size: 15px; }
.term-list li b em { font-style: normal; font-size: 12px; color: var(--ok); margin-left: 6px; }
.term-list li > span:not(.tag) { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.term-list li.is-ng b { color: var(--ng); }
.term-list.removable li { grid-template-columns: auto 1fr auto; }
.term-list.removable li > span:not(.tag) { grid-column: 1 / 3; }
.rm { grid-column: 3; grid-row: 1 / 3; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 700; color: var(--ok); cursor: pointer; white-space: nowrap; }

.best-list { list-style: none; padding: 0; margin: 0; }
.best-list li { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.best-list li:first-child { border-top: none; }

.empty { text-align: center; padding: 36px 20px; }
.empty-icon { font-size: 48px; }
.empty .btn { margin-top: 16px; }

/* ---------- ① スワイプ ---------- */
.swipe-wrap { max-width: 420px; margin: 0 auto; }
.swipe-wrap .counter { display: block; text-align: center; }
.swipe-stage { position: relative; height: min(56vh, 400px); min-height: 300px; margin: 8px 0 18px; }
.swipe-card {
  position: absolute; inset: 0; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  perspective: 1200px; animation: cardIn .3s ease;
}
.swipe-card:active { cursor: grabbing; }
@keyframes cardIn { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
.flip { position: relative; width: 100%; height: 100%; transition: transform .45s ease; transform-style: preserve-3d; }
.swipe-card.flipped .flip { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px; text-align: center;
}
.face.face-back { transform: rotateY(180deg); background: var(--surface-2); }
.sc-term { font-size: clamp(26px, 8vw, 38px); font-weight: 800; word-break: break-word; }
.sc-term-sm { font-size: 20px; font-weight: 800; }
.sc-tip { font-size: 13px; color: var(--muted); }
.sc-desc { font-size: 17px; line-height: 1.75; }
.stamp {
  position: absolute; top: 22px; z-index: 3; padding: 4px 12px; border: 3px solid; border-radius: 10px;
  font-weight: 800; font-size: 20px; opacity: 0; pointer-events: none; background: var(--surface);
}
.stamp-yes { left: 20px; color: var(--ok); transform: rotate(-12deg); }
.stamp-no { right: 20px; color: var(--ng); transform: rotate(12deg); }
.swipe-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn-no { border-color: var(--ng); color: var(--ng); background: var(--ng-soft); }
.btn-yes { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }

/* ---------- ② 神経衰弱 ---------- */
.mem-stats { display: flex; justify-content: space-around; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 14px; font-size: 14px; }
.mem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mem-grid.mem-easy { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 560px) { .mem-grid, .mem-grid.mem-easy { grid-template-columns: repeat(4, 1fr); } }
.mem-card { position: relative; display: block; border: none; padding: 0; background: none; cursor: pointer; perspective: 900px; }
/* 2つの面を同じマスに重ね、長い説明文に合わせてカードの高さが伸びるようにする */
.mem-inner { display: grid; height: 100%; min-height: 128px; transition: transform .4s ease; transform-style: preserve-3d; }
.mem-easy .mem-inner { min-height: 120px; }
.mem-card.open .mem-inner, .mem-card.done .mem-inner { transform: rotateY(180deg); }
.mem-face { grid-area: 1 / 1; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; }
.mem-back {
  background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 60%, #ec4899));
  color: #fff; font-size: 32px; font-weight: 800; box-shadow: var(--shadow);
}
.mem-front { transform: rotateY(180deg); background: var(--surface); border: 2px solid var(--line); gap: 4px; text-align: center; }
.mem-kind { font-size: 10px; font-weight: 800; color: var(--muted); }
.mem-term .mem-text { font-size: 15px; font-weight: 800; word-break: break-word; }
.mem-desc .mem-text { font-size: 11.5px; line-height: 1.45; }
.mem-card.done .mem-front { border-color: var(--ok); background: var(--ok-soft); }
.mem-card.done { cursor: default; animation: matched .4s ease; }
@keyframes matched { 50% { transform: scale(1.06); } }
.mem-card.shake { animation: shake .35s ease; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* ---------- ③ 仕分け ---------- */
.howto { margin: 0 0 16px; padding-left: 20px; font-size: 14px; }
.howto li { margin: 4px 0; }
kbd { font-family: inherit; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; background: var(--surface-2); }
.bins-preview { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.sort-hud { position: sticky; top: 58px; z-index: 5; background: var(--bg); padding-bottom: 6px; }
.time-line { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.time-line span { display: block; height: 100%; width: 100%; background: var(--primary); border-radius: inherit; transition: width .1s linear; }
.sort-hud.hurry .time-line span { background: var(--ng); }
.sort-hud.hurry #s-time { color: var(--ng); }
.hud-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 14px; }
.hud-row b { font-size: 20px; }
.combo { color: var(--s); font-weight: 800; }
.sort-stage { height: min(38vh, 280px); min-height: 200px; display: grid; place-items: center; }
.sort-card {
  background: var(--surface); border: 2px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  padding: 26px 28px; min-width: 220px; max-width: 90%; text-align: center; cursor: grab;
  touch-action: none; user-select: none; -webkit-user-select: none; animation: dropIn .3s ease; position: relative; z-index: 6;
  display: flex; flex-direction: column; gap: 6px;
}
.sort-card.dragging { cursor: grabbing; box-shadow: 0 16px 40px rgba(30, 20, 80, .25); border-color: var(--primary); transition: none; }
@keyframes dropIn { from { transform: translateY(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
.sort-term { font-size: clamp(22px, 6.5vw, 30px); font-weight: 800; word-break: break-word; }
.sort-tip { font-size: 12px; color: var(--muted); }
.sort-card.gone-ok { transition: all .18s ease; transform: translateY(160px) scale(.4) !important; opacity: 0; }

  <script>
/* ===== js/core.js ===== */
/*
 * 共通処理：試験の版（モード）、学習記録の保存（ブラウザ内）、便利関数
 */
window.ITP = window.ITP || {};

/* ---------- 試験の版（モード） ---------- */
ITP.MODES = {
  now: {
    label: "今年度版", short: "2026年度版",
    exam: "2026年度の試験（2027年3月まで）", basis: "シラバス Ver.6.4",
    cats: {
      S: { name: "ストラテジ", color: "s", desc: "経営・法務・企業活動・システム戦略" },
      M: { name: "マネジメント", color: "m", desc: "開発・プロジェクト・サービス管理・監査" },
      T: { name: "テクノロジ", color: "t", desc: "コンピュータ・ネットワーク・セキュリティ" }
    }
  },
  next: {
    label: "次年度以降版", short: "2027年度〜版",
    exam: "2027年度からの新試験（120分・100問）", basis: "シラバス案 Ver.0.1（2026年8月公表）",
    cats: {
      B: { name: "ビジネス", color: "s", desc: "DX・データ/AI活用・経営・組織・マネジメント" },
      T: { name: "テクノロジ", color: "t", desc: "デジタル技術・クラウド・AI技術・システム開発" },
      E: { name: "セキュリティ・倫理", color: "e", desc: "脅威と対策・法規・情報倫理・AI倫理" }
    }
  }
};

/** モードに合わせて ITP.TERMS（出題する用語）と ITP.CATS（分野）を組み立てる */
ITP.setMode = function (mode) {
  if (!ITP.MODES[mode]) mode = "now";
  ITP.mode = mode;
  ITP.CATS = ITP.MODES[mode].cats;
  if (mode === "next") {
    const ov = ITP.NEXT_OVERRIDES || {}, def = ITP.NEXT_DEFAULT || {};
    ITP.TERMS = ITP.TERMS_NOW.map(t => Object.assign({}, t, { cat: ov[t.term] || def[t.cat] }))
      .concat((ITP.TERMS_NEXT_ADD || []).map(t => Object.assign({}, t, { isNew: true })));
  } else {
    ITP.TERMS = ITP.TERMS_NOW.map(t => Object.assign({}, t));
  }
  if (ITP.store) ITP.store.setMode(mode);
};

/* ---------- 便利関数 ---------- */
ITP.util = {
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },
  esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  },
  fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + String(s).padStart(2, "0");
  },
  catTag(cat) {
    const c = ITP.CATS[cat];
    return `<span class="tag tag-${c.color}">${c.name}</span>`;
  },
  /** 新シラバス案で追加された用語の目印 */
  newTag(t) {
    return t && t.isNew ? `<span class="tag tag-new" title="新試験のシラバス案で登場する用語">NEW</span>` : "";
  },
  /** 分野指定（"all" / 分野キー / "review"）から用語リストを返す */
  termsFor(cat) {
    if (cat === "review") {
      const set = new Set(ITP.store.reviewTerms());
      return ITP.TERMS.filter(t => set.has(t.term));
    }
    if (cat === "new") return ITP.TERMS.filter(t => t.isNew);
    if (ITP.CATS[cat]) return ITP.TERMS.filter(t => t.cat === cat);
    return ITP.TERMS.slice();
  },
  /** 学習レベルの低い用語を優先しつつシャッフル */
  pickWeighted(list, n) {
    const shuffled = ITP.util.shuffle(list);
    shuffled.sort((a, b) => ITP.store.level(a.term) - ITP.store.level(b.term));
    return ITP.util.shuffle(shuffled.slice(0, n));
  },
  /** ゲーム画面の見出し */
  head(icon, title, sub) {
    return `<div class="game-head">
      <a href="#/" class="back" aria-label="ホームに戻る">‹</a>
      <div><h1><span aria-hidden="true">${icon}</span> ${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>
    </div>`;
  },
  toast(msg, kind) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "show" + (kind ? " " + kind : "");
    clearTimeout(ITP.util._toastTimer);
    ITP.util._toastTimer = setTimeout(() => { el.className = ""; }, 1800);
  },
  /** 分野選択ボタン群のHTML */
  catPicker(selected, withReview) {
    const opts = [["all", "すべて"]].concat(Object.keys(ITP.CATS).map(k => [k, ITP.CATS[k].name]));
    if (ITP.TERMS.some(t => t.isNew)) opts.push(["new", "新シラバス用語"]);
    if (withReview) opts.push(["review", "復習リスト"]);
    if (!opts.some(o => o[0] === selected)) selected = "all";
    return `<div class="chips" data-group="cat">` + opts.map(([v, l]) =>
      `<button type="button" class="chip ${v === selected ? "on" : ""} ${v === "review" ? "chip-review" : ""}" data-value="${v}">${l} <small>${ITP.util.termsFor(v).length}</small></button>`
    ).join("") + `</div>`;
  },
  /** チップ選択の共通挙動。選ばれた値を返す関数を返す */
  bindChips(root) {
    root.querySelectorAll(".chips").forEach(group => {
      group.addEventListener("click", e => {
        const b = e.target.closest(".chip");
        if (!b) return;
        group.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
      });
    });
    return name => {
      const on = root.querySelector(`.chips[data-group="${name}"] .chip.on`);
      return on ? on.dataset.value : null;
    };
  }
};

/* ---------- 学習記録 ---------- */
(function () {
  const KEY = "itpass-gamelab-v1";
  const blank = () => ({ mode: "now", terms: {}, reviewTerms: [], reviewCalc: [], best: {} });
  let state = blank();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) state = Object.assign(blank(), JSON.parse(raw));
  } catch (e) { /* 保存できない環境でも動くようにする */ }

  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { }
    if (ITP.store.onChange) ITP.store.onChange();
  };
  const addUnique = (arr, v) => { if (!arr.includes(v)) arr.push(v); };
  const remove = (arr, v) => { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); };

  /*
   * 習熟レベル（0〜3）
   *   正解 / 「知ってる」 … +1
   *   不正解 / 「知らない」… 0 に戻して復習リストへ
   *   レベル2以上を「習得済み」としてゲージに表示
   */
  ITP.store = {
    MASTER_LEVEL: 2,
    getMode() { return state.mode || "now"; },
    setMode(m) { if (state.mode !== m) { state.mode = m; save(); } },
    level(term) { return (state.terms[term] && state.terms[term].lv) || 0; },
    correct(term) {
      const t = state.terms[term] || (state.terms[term] = { lv: 0 });
      t.lv = Math.min(3, t.lv + 1);
      remove(state.reviewTerms, term);
      save();
    },
    wrong(term) {
      state.terms[term] = { lv: 0 };
      addUnique(state.reviewTerms, term);
      save();
    },
    /** 仕分けゲームでのミス：レベルを1下げて復習リストへ */
    soft(term) {
      const t = state.terms[term] || (state.terms[term] = { lv: 0 });
      t.lv = Math.max(0, t.lv - 1);
      addUnique(state.reviewTerms, term);
      save();
    },
    /** 今のモードで出題される用語だけを返す（他モード専用の用語は保持したまま非表示） */
    reviewTerms() {
      const set = new Set(ITP.TERMS.map(x => x.term));
      return state.reviewTerms.filter(t => set.has(t));
    },
    removeReview(term) { remove(state.reviewTerms, term); save(); },
    calcCorrect(id) { remove(state.reviewCalc, id); save(); },
    calcWrong(id) { addUnique(state.reviewCalc, id); save(); },
    reviewCalc() { return state.reviewCalc.filter(id => ITP.CALC.some(c => c.id === id)); },
    removeCalc(id) { remove(state.reviewCalc, id); save(); },
    reviewCount() { return this.reviewTerms().length + this.reviewCalc().length; },
    best(key) { return state.best[key]; },
    /** better(新, 旧) が true なら記録更新。更新したら true を返す */
    setBest(key, val, better) {
      const old = state.best[key];
      if (old === undefined || better(val, old)) { state.best[key] = val; save(); return true; }
      return false;
    },
    progress(cat) {
      const list = ITP.TERMS.filter(t => !cat || t.cat === cat);
      let mastered = 0, learning = 0;
      list.forEach(t => {
        const lv = this.level(t.term);
        if (lv >= this.MASTER_LEVEL) mastered++; else if (lv > 0) learning++;
      });
      return { total: list.length, mastered, learning };
    },
    reset() { const m = state.mode; state = blank(); state.mode = m; save(); }
  };
})();

ITP.setMode(ITP.store.getMode());

</script>

  <script>
/* ===== js/games/swipe.js ===== */
/*
 * ① スワイプ用語カード
 *   右スワイプ＝知ってる / 左スワイプ＝知らない。タップで意味を表示。
 */
window.ITP = window.ITP || {};
ITP.games = ITP.games || {};

ITP.games.swipe = {
  title: "スワイプ用語カード",
  render(root, params) {
    const U = ITP.util;
    let timers = [];
    let keyHandler = null;

    function setup() {
      const preset = params.cat || "all";
      root.innerHTML = `
        ${U.head("🃏", "スワイプ用語カード", "知ってたら右へ、知らなかったら左へ。カードをタップすると意味が見られます。")}
        <div class="panel setup">
          <h2>分野</h2>
          ${U.catPicker(preset, true)}
          <h2>枚数</h2>
          <div class="chips" data-group="n">
            <button type="button" class="chip on" data-value="10">10枚</button>
            <button type="button" class="chip" data-value="20">20枚</button>
            <button type="button" class="chip" data-value="40">40枚</button>
          </div>
          <button type="button" class="btn btn-primary btn-block" id="start">はじめる</button>
          <p class="note">まだ覚えていない用語から優先して出題します。</p>
        </div>`;
      const get = U.bindChips(root);
      root.querySelector("#start").addEventListener("click", () => {
        const cat = get("cat"), n = +get("n");
        const pool = U.termsFor(cat);
        if (!pool.length) { U.toast("この分野には出題できる用語がありません"); return; }
        play(U.pickWeighted(pool, n), cat, n);
      });
      if (params.start && U.termsFor(preset).length) {
        play(U.pickWeighted(U.termsFor(preset), 20), preset, 20);
      }
    }

    function play(deck, cat, n) {
      let idx = 0;
      const known = [], unknown = [];
      root.innerHTML = `
        ${U.head("🃏", "スワイプ用語カード")}
        <div class="swipe-wrap">
          <div class="progress-line"><span id="sw-bar"></span></div>
          <p class="counter" id="sw-count"></p>
          <div class="swipe-stage" id="stage"></div>
          <div class="swipe-actions">
            <button type="button" class="btn btn-no" id="no"><span aria-hidden="true">←</span> 知らない</button>
            <button type="button" class="btn btn-yes" id="yes">知ってる <span aria-hidden="true">→</span></button>
          </div>
          <p class="note center">PCでは ← → キーでも操作できます／スペースキーで裏返し</p>
        </div>`;
      const stage = root.querySelector("#stage");
      let current = null, busy = false;

      function showCard() {
        root.querySelector("#sw-count").textContent = `${idx + 1} / ${deck.length}`;
        root.querySelector("#sw-bar").style.width = (idx / deck.length) * 100 + "%";
        const t = deck[idx];
        stage.innerHTML = `
          <div class="swipe-card" id="card" tabindex="0" role="button" aria-label="${U.esc(t.term)}。タップで意味を表示">
            <span class="stamp stamp-yes">知ってる</span>
            <span class="stamp stamp-no">知らない</span>
            <div class="flip">
              <div class="face face-front">
                <span>${U.catTag(t.cat)} ${U.newTag(t)}</span>
                <div class="sc-term">${U.esc(t.term)}</div>
                <div class="sc-tip">タップで意味を見る</div>
              </div>
              <div class="face face-back">
                ${U.catTag(t.cat)}
                <div class="sc-term-sm">${U.esc(t.term)}</div>
                <div class="sc-desc">${U.esc(t.desc)}</div>
              </div>
            </div>
          </div>`;
        current = stage.querySelector("#card");
        bindDrag(current);
        busy = false;
      }

      function decide(isKnown) {
        if (busy || !current) return;
        busy = true;
        const t = deck[idx];
        if (isKnown) { known.push(t); ITP.store.correct(t.term); }
        else { unknown.push(t); ITP.store.wrong(t.term); }
        current.style.transition = "transform .3s ease, opacity .3s ease";
        current.style.transform = `translateX(${isKnown ? 120 : -120}vw) rotate(${isKnown ? 25 : -25}deg)`;
        current.style.opacity = "0";
        timers.push(setTimeout(() => {
          idx++;
          if (idx >= deck.length) finish(); else showCard();
        }, 260));
      }

      function bindDrag(card) {
        let sx = 0, sy = 0, dx = 0, dragging = false, moved = false;
        const yes = card.querySelector(".stamp-yes"), no = card.querySelector(".stamp-no");
        card.addEventListener("pointerdown", e => {
          if (busy) return;
          dragging = true; moved = false; sx = e.clientX; sy = e.clientY; dx = 0;
          card.setPointerCapture(e.pointerId);
          card.style.transition = "none";
        });
        card.addEventListener("pointermove", e => {
          if (!dragging) return;
          dx = e.clientX - sx;
          if (Math.abs(dx) > 6 || Math.abs(e.clientY - sy) > 6) moved = true;
          card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
          yes.style.opacity = Math.max(0, Math.min(1, dx / 90));
          no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
        });
        const end = () => {
          if (!dragging) return;
          dragging = false;
          if (dx > 90) return decide(true);
          if (dx < -90) return decide(false);
          card.style.transition = "transform .25s ease";
          card.style.transform = "";
          yes.style.opacity = 0; no.style.opacity = 0;
          if (!moved) card.classList.toggle("flipped");
        };
        card.addEventListener("pointerup", end);
        card.addEventListener("pointercancel", end);
        card.addEventListener("keydown", e => {
          if (e.key === "Enter") { e.preventDefault(); card.classList.toggle("flipped"); }
        });
      }

      keyHandler = e => {
        if (e.key === "ArrowRight") decide(true);
        else if (e.key === "ArrowLeft") decide(false);
        else if (e.key === " " && current) { e.preventDefault(); current.classList.toggle("flipped"); }
      };
      document.addEventListener("keydown", keyHandler);
      root.querySelector("#yes").addEventListener("click", () => decide(true));
      root.querySelector("#no").addEventListener("click", () => decide(false));
      showCard();

      function finish() {
        document.removeEventListener("keydown", keyHandler);
        keyHandler = null;
        const rate = Math.round((known.length / deck.length) * 100);
        root.innerHTML = `
          ${U.head("🃏", "スワイプ用語カード")}
          <div class="panel result">
            <div class="result-big">${rate}<small>%</small></div>
            <p class="result-sub">知ってる ${known.length}枚 ／ 知らない ${unknown.length}枚</p>
            <p class="result-msg">${rate === 100 ? "全部知ってた！次は別の分野にも挑戦しよう" : rate >= 70 ? "いい調子！知らなかった用語だけもう一周しよう" : "「聞いたことある」が増えれば十分。知らなかった用語をもう一周しよう"}</p>
            <div class="btn-row">
              ${unknown.length ? `<button type="button" class="btn btn-primary" id="again-unknown">知らなかった${unknown.length}枚をもう一度</button>` : ""}
              <button type="button" class="btn" id="again">別のカードで遊ぶ</button>
              <a class="btn btn-ghost" href="#/">ホームへ</a>
            </div>
          </div>
          ${unknown.length ? `<div class="panel"><h2>知らなかった用語</h2><p class="note">復習リストに追加しました。</p>
            <ul class="term-list">${unknown.map(t => `<li>${U.catTag(t.cat)}<b>${U.newTag(t)}${U.esc(t.term)}</b><span>${U.esc(t.desc)}</span></li>`).join("")}</ul></div>` : ""}`;
        const ag = root.querySelector("#again-unknown");
        if (ag) ag.addEventListener("click", () => play(U.shuffle(unknown), cat, n));
        root.querySelector("#again").addEventListener("click", () => {
          const pool = U.termsFor(cat);
          if (!pool.length) { setup(); return; }
          play(U.pickWeighted(pool, n), cat, n);
        });
      }
    }

    setup();
    return () => {
      timers.forEach(clearTimeout);
      if (keyHandler) document.removeEventListener("keydown", keyHandler);
    };
  }
};

</script>
  <script>
/* ===== js/games/memory.js ===== */
/*
 * ② 神経衰弱マッチング
 *   「用語」カードと「意味」カードのペアをそろえる。タイムと手数を記録。
 */
window.ITP = window.ITP || {};
ITP.games = ITP.games || {};

ITP.games.memory = {
  title: "神経衰弱マッチング",
  render(root, params) {
    const U = ITP.util;
    let timers = [], tick = null;
    const LEVELS = { easy: { pairs: 4, label: "かんたん" }, normal: { pairs: 6, label: "ふつう" }, hard: { pairs: 8, label: "むずかしい" } };

    function setup() {
      const bestHtml = Object.keys(LEVELS).map(k => {
        const b = ITP.store.best("memory_" + k);
        return `<li><span>${LEVELS[k].label}</span><b>${b ? U.fmtTime(b.time) + "（" + b.moves + "手）" : "—"}</b></li>`;
      }).join("");
      root.innerHTML = `
        ${U.head("🧠", "神経衰弱マッチング", "「用語」と「意味」のカードをめくって、ペアをそろえよう。")}
        <div class="panel setup">
          <h2>分野</h2>
          ${U.catPicker(params.cat || "all", false)}
          <h2>難しさ</h2>
          <div class="chips" data-group="lv">
            <button type="button" class="chip on" data-value="easy">かんたん（4ペア）</button>
            <button type="button" class="chip" data-value="normal">ふつう（6ペア）</button>
            <button type="button" class="chip" data-value="hard">むずかしい（8ペア）</button>
          </div>
          <button type="button" class="btn btn-primary btn-block" id="start">はじめる</button>
          <h2>ベスト記録</h2>
          <ul class="best-list">${bestHtml}</ul>
        </div>`;
      const get = U.bindChips(root);
      root.querySelector("#start").addEventListener("click", () => play(get("cat"), get("lv")));
    }

    function play(cat, lv) {
      const pairs = LEVELS[lv].pairs;
      const terms = U.shuffle(U.termsFor(cat)).slice(0, pairs);
      const cards = U.shuffle(terms.flatMap((t, i) => [
        { pair: i, kind: "term", text: t.term, cat: t.cat },
        { pair: i, kind: "desc", text: t.desc, cat: t.cat }
      ]));
      let open = [], matched = 0, moves = 0, start = null, lock = false;

      root.innerHTML = `
        ${U.head("🧠", "神経衰弱マッチング")}
        <div class="mem-stats">
          <span>⏱ <b id="m-time">0:00</b></span>
          <span>手数 <b id="m-moves">0</b></span>
          <span>ペア <b id="m-pairs">0</b>/${pairs}</span>
        </div>
        <div class="mem-grid mem-${lv}" id="grid">
          ${cards.map((c, i) => `
            <button type="button" class="mem-card" data-i="${i}" aria-label="カード${i + 1}（裏向き）">
              <span class="mem-inner">
                <span class="mem-face mem-back" aria-hidden="true">?</span>
                <span class="mem-face mem-front mem-${c.kind} cat-${ITP.CATS[c.cat].color}">
                  <span class="mem-kind">${c.kind === "term" ? "用語" : "意味"}</span>
                  <span class="mem-text">${U.esc(c.text)}</span>
                </span>
              </span>
            </button>`).join("")}
        </div>
        <p class="note center">同じ用語の「用語」カードと「意味」カードがペアです。</p>`;

      const grid = root.querySelector("#grid");
      const els = [...grid.querySelectorAll(".mem-card")];

      grid.addEventListener("click", e => {
        const btn = e.target.closest(".mem-card");
        if (!btn || lock) return;
        const i = +btn.dataset.i;
        if (btn.classList.contains("open") || btn.classList.contains("done")) return;
        if (!start) {
          start = Date.now();
          tick = setInterval(() => { root.querySelector("#m-time").textContent = U.fmtTime((Date.now() - start) / 1000); }, 250);
        }
        btn.classList.add("open");
        btn.setAttribute("aria-label", (cards[i].kind === "term" ? "用語：" : "意味：") + cards[i].text);
        open.push(i);
        if (open.length < 2) return;

        moves++;
        root.querySelector("#m-moves").textContent = moves;
        const [a, b] = open;
        open = [];
        if (cards[a].pair === cards[b].pair && cards[a].kind !== cards[b].kind) {
          matched++;
          root.querySelector("#m-pairs").textContent = matched;
          timers.push(setTimeout(() => {
            els[a].classList.add("done"); els[b].classList.add("done");
            if (matched === pairs) finish();
          }, 350));
        } else {
          lock = true;
          timers.push(setTimeout(() => {
            [a, b].forEach(k => {
              els[k].classList.remove("open");
              els[k].setAttribute("aria-label", `カード${k + 1}（裏向き）`);
              els[k].classList.add("shake");
            });
            timers.push(setTimeout(() => els.forEach(x => x.classList.remove("shake")), 400));
            lock = false;
          }, 1000));
        }
      });

      function finish() {
        clearInterval(tick); tick = null;
        const time = (Date.now() - start) / 1000;
        const rec = ITP.store.setBest("memory_" + lv, { time, moves }, (n, o) => n.time < o.time);
        const perfect = moves === pairs;
        timers.push(setTimeout(() => {
          root.innerHTML = `
            ${U.head("🧠", "神経衰弱マッチング")}
            <div class="panel result">
              ${rec ? `<div class="badge-new">ベスト記録更新！</div>` : ""}
              <div class="result-big">${U.fmtTime(time)}</div>
              <p class="result-sub">${LEVELS[lv].label}・${moves}手でクリア${perfect ? "（ノーミス！）" : ""}</p>
              <div class="btn-row">
                <button type="button" class="btn btn-primary" id="again">もう一度</button>
                <button type="button" class="btn" id="change">設定を変える</button>
                <a class="btn btn-ghost" href="#/">ホームへ</a>
              </div>
            </div>
            <div class="panel"><h2>今回のペア</h2>
              <ul class="term-list">${terms.map(t => `<li>${U.catTag(t.cat)}<b>${U.newTag(t)}${U.esc(t.term)}</b><span>${U.esc(t.desc)}</span></li>`).join("")}</ul>
            </div>`;
          root.querySelector("#again").addEventListener("click", () => play(cat, lv));
          root.querySelector("#change").addEventListener("click", setup);
        }, 600));
      }
    }

    setup();
    return () => { timers.forEach(clearTimeout); clearInterval(tick); };
  }
};

</script>
  <script>
/* ===== js/games/sort.js ===== */
/*
 * ③ 3分野仕分けレース
 *   60秒で、流れてくる用語を3つの箱へドラッグ（またはタップ）して仕分ける。
 */
window.ITP = window.ITP || {};
ITP.games = ITP.games || {};

ITP.games.sort = {
  title: "3分野仕分けレース",
  render(root) {
    const U = ITP.util;
    const LIMIT = 60;
    let timers = [], tick = null, keyHandler = null;

    function setup() {
      const best = ITP.store.best("sort_" + ITP.mode);
      const keys = Object.keys(ITP.CATS);
      root.innerHTML = `
        ${U.head("📦", "3分野仕分けレース", "用語がどの分野に属するかを、60秒でできるだけたくさん仕分けよう。")}
        <div class="panel setup">
          <ul class="howto">
            <li>カードを下の箱へ<b>ドラッグ</b>するか、<b>箱をタップ</b>して仕分けます</li>
            <li>連続正解で<b>コンボボーナス</b>。間違えると復習リストに入ります</li>
            <li>PCでは <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> キーでも操作できます</li>
          </ul>
          <div class="bins-preview">
            ${keys.map(k => `${U.catTag(k)}<small>${ITP.CATS[k].desc}</small>`).join("")}
          </div>
          <p class="note">${ITP.MODES[ITP.mode].label}（${ITP.MODES[ITP.mode].basis}）の分野で仕分けます。</p>
          <button type="button" class="btn btn-primary btn-block" id="start">スタート</button>
          <p class="note center">ベストスコア：<b>${best !== undefined ? best + "点" : "—"}</b></p>
        </div>`;
      root.querySelector("#start").addEventListener("click", play);
    }

    function play() {
      const deck = U.shuffle(ITP.TERMS);
      let i = 0, score = 0, combo = 0, maxCombo = 0, correct = 0;
      const misses = [];
      const endAt = Date.now() + LIMIT * 1000;
      let ended = false;

      root.innerHTML = `
        ${U.head("📦", "3分野仕分けレース")}
        <div class="sort-hud">
          <div class="time-line"><span id="s-bar"></span></div>
          <div class="hud-row">
            <span>残り <b id="s-time">${LIMIT}</b>秒</span>
            <span class="combo" id="s-combo"></span>
            <span><b id="s-score">0</b>点</span>
          </div>
        </div>
        <div class="sort-stage" id="stage"></div>
        <div class="bins" id="bins">
          ${Object.keys(ITP.CATS).map((k, n) => `<button type="button" class="bin bin-${ITP.CATS[k].color}" data-cat="${k}"><span class="bin-key">${n + 1}</span>${ITP.CATS[k].name}</button>`).join("")}
        </div>`;

      const stage = root.querySelector("#stage");
      const bins = [...root.querySelectorAll(".bin")];
      let card = null, locked = false;

      function next() {
        if (ended) return;
        if (i >= deck.length) { i = 0; }
        const t = deck[i];
        stage.innerHTML = `<div class="sort-card" id="card">${U.newTag(t)}<span class="sort-term">${U.esc(t.term)}</span><span class="sort-tip">ドラッグして箱へ</span></div>`;
        card = stage.querySelector("#card");
        bindDrag(card);
        locked = false;
      }

      function answer(cat) {
        if (locked || ended) return;
        locked = true;
        const t = deck[i];
        i++;
        const ok = t.cat === cat;
        const bin = bins.find(b => b.dataset.cat === cat);
        if (ok) {
          combo++; correct++;
          maxCombo = Math.max(maxCombo, combo);
          const gain = 10 + Math.min(combo - 1, 10) * 2;
          score += gain;
          flash(bin, "ok");
          card.classList.add("gone-ok");
        } else {
          combo = 0;
          misses.push(t);
          ITP.store.soft(t.term);
          flash(bin, "ng");
          card.classList.add("gone-ng");
          U.toast(`「${t.term}」は ${ITP.CATS[t.cat].name}`, "ng");
        }
        root.querySelector("#s-score").textContent = score;
        root.querySelector("#s-combo").textContent = combo >= 2 ? `🔥 ${combo}コンボ` : "";
        timers.push(setTimeout(next, ok ? 180 : 450));
      }

      function flash(el, kind) {
        el.classList.remove("ok", "ng");
        void el.offsetWidth;
        el.classList.add(kind);
        timers.push(setTimeout(() => el.classList.remove(kind), 350));
      }

      function binAt(x, y) {
        return bins.find(b => {
          const r = b.getBoundingClientRect();
          return x >= r.left && x <= r.right && y >= r.top - 20 && y <= r.bottom;
        });
      }

      function bindDrag(el) {
        let sx = 0, sy = 0, dragging = false;
        el.addEventListener("pointerdown", e => {
          if (locked) return;
          dragging = true; sx = e.clientX; sy = e.clientY;
          el.setPointerCapture(e.pointerId);
          el.classList.add("dragging");
        });
        el.addEventListener("pointermove", e => {
          if (!dragging) return;
          el.style.transform = `translate(${e.clientX - sx}px, ${e.clientY - sy}px) rotate(${(e.clientX - sx) / 25}deg)`;
          const over = binAt(e.clientX, e.clientY);
          bins.forEach(b => b.classList.toggle("hover", b === over));
        });
        const end = e => {
          if (!dragging) return;
          dragging = false;
          el.classList.remove("dragging");
          bins.forEach(b => b.classList.remove("hover"));
          const over = binAt(e.clientX, e.clientY);
          if (over) { answer(over.dataset.cat); }
          else { el.style.transform = ""; }
        };
        el.addEventListener("pointerup", end);
        el.addEventListener("pointercancel", () => { dragging = false; el.classList.remove("dragging"); el.style.transform = ""; });
      }

      bins.forEach(b => b.addEventListener("click", () => answer(b.dataset.cat)));
      keyHandler = e => {
        const k = Object.keys(ITP.CATS)[+e.key - 1];
        if (k) answer(k);
      };
      document.addEventListener("keydown", keyHandler);

      tick = setInterval(() => {
        const left = Math.max(0, (endAt - Date.now()) / 1000);
        root.querySelector("#s-time").textContent = Math.ceil(left);
        root.querySelector("#s-bar").style.width = (left / LIMIT) * 100 + "%";
        if (left <= 10) root.querySelector(".sort-hud").classList.add("hurry");
        if (left <= 0) finish();
      }, 100);
      next();

      function finish() {
        if (ended) return;
        ended = true;
        clearInterval(tick); tick = null;
        document.removeEventListener("keydown", keyHandler); keyHandler = null;
        const total = correct + misses.length;
        const rate = total ? Math.round((correct / total) * 100) : 0;
        const rec = ITP.store.setBest("sort_" + ITP.mode, score, (n, o) => n > o);
        root.innerHTML = `
          ${U.head("📦", "3分野仕分けレース")}
          <div class="panel result">
            ${rec && score > 0 ? `<div class="badge-new">ベストスコア更新！</div>` : ""}
            <div class="result-big">${score}<small>点</small></div>
            <p class="result-sub">${total}枚中 ${correct}枚正解（正答率 ${rate}%）・最大 ${maxCombo}コンボ</p>
            <div class="btn-row">
              <button type="button" class="btn btn-primary" id="again">もう一度</button>
              <a class="btn btn-ghost" href="#/">ホームへ</a>
            </div>
          </div>
          ${misses.length ? `<div class="panel"><h2>間違えた用語</h2><p class="note">正しい分野と意味を確認しよう（復習リストに追加しました）。</p>
            <ul class="term-list">${misses.map(t => `<li>${U.catTag(t.cat)}<b>${U.newTag(t)}${U.esc(t.term)}</b><span>${U.esc(t.desc)}</span></li>`).join("")}</ul></div>` : ""}`;
        root.querySelector("#again").addEventListener("click", play);
      }
    }

    setup();
    return () => {
      timers.forEach(clearTimeout);
      clearInterval(tick);
      if (keyHandler) document.removeEventListener("keydown", keyHandler);
    };
  }
};

  <script>
/* ===== js/games/hint.js ===== */
/*
 * ⑤ ヒント開示クイズ
 *   ヒントを1つずつ開いて4択で答える。少ないヒントで当てるほど高得点（30→20→10点）。
 */
window.ITP = window.ITP || {};
ITP.games = ITP.games || {};

ITP.games.hint = {
  title: "ヒント開示クイズ",
  render(root, params) {
    const U = ITP.util;
    const POINTS = [30, 20, 10];
    let timers = [];

    function setup() {
      const preset = params.cat || "all";
      const best = ITP.store.best("hint_" + ITP.mode);
      root.innerHTML = `
        ${U.head("🔍", "ヒント開示クイズ", "ヒントを見ながら用語を当てよう。ヒントが少ないうちに答えるほど高得点！")}
        <div class="panel setup">
          <div class="point-rule">
            <div><b>30点</b><small>ヒント1つで正解</small></div>
            <div><b>20点</b><small>ヒント2つで正解</small></div>
            <div><b>10点</b><small>ヒント3つで正解</small></div>
          </div>
          <h2>分野</h2>
          ${U.catPicker(preset, true)}
          <h2>問題数</h2>
          <div class="chips" data-group="n">
            <button type="button" class="chip" data-value="5">5問</button>
            <button type="button" class="chip on" data-value="10">10問</button>
            <button type="button" class="chip" data-value="20">20問</button>
          </div>
          <button type="button" class="btn btn-primary btn-block" id="start">はじめる</button>
          <p class="note center">ベストスコア（10問）：<b>${best !== undefined ? best + "点" : "—"}</b></p>
        </div>`;
      const get = U.bindChips(root);
      root.querySelector("#start").addEventListener("click", () => {
        const cat = get("cat"), n = +get("n");
        const pool = U.termsFor(cat);
        if (!pool.length) { U.toast("この分野には出題できる用語がありません"); return; }
        play(U.pickWeighted(pool, n), cat, n);
      });
      if (params.start && U.termsFor(preset).length) {
        const pool = U.termsFor(preset);
        play(U.pickWeighted(pool, Math.min(10, pool.length)), preset, 10);
      }
    }

    // 説明文の末尾から「何の種類の用語か」を判定（攻撃なら攻撃同士、法律なら法律同士で選択肢を作るため）
    const KINDS = ["攻撃", "法律", "権利", "マルウェア", "指標", "分析する手法", "手法", "方式", "契約", "テスト", "組織", "図", "装置", "プロトコル", "ネットワーク", "データ構造", "規格", "制度", "活動", "仕組み", "技術", "考え方", "状態", "現象", "AI", "メモリ", "利益", "資産", "費用", "形態", "情報", "ソフトウェア", "サービス", "設計"];
    const kindOf = d => KINDS.find(k => d.replace(/[（(].*?[)）]$/, "").endsWith(k)) || "";

    function choicesFor(t) {
      // 同じ分野・同じ種類の用語を優先して、紛らわしい選択肢を3つ選ぶ
      const k = kindOf(t.desc);
      const sameCat = U.shuffle(ITP.TERMS.filter(x => x.cat === t.cat && x.term !== t.term));
      const sameKind = k ? U.shuffle(ITP.TERMS.filter(x => x.term !== t.term && kindOf(x.desc) === k)) : [];
      const picked = [];
      [sameKind.filter(x => x.cat === t.cat), sameKind, sameCat, U.shuffle(ITP.TERMS.filter(x => x.term !== t.term))]
        .forEach(list => list.forEach(x => { if (picked.length < 3 && !picked.includes(x)) picked.push(x); }));
      return U.shuffle([t, ...picked]);
    }

    function play(qs, cat, n) {
      let qi = 0, score = 0;
      const log = [];

      function showQ() {
        const t = qs[qi];
        const hints = [t.hints[0], t.hints[1], t.desc];
        const opts = choicesFor(t);
        let shown = 1, answered = false;

        root.innerHTML = `
          ${U.head("🔍", "ヒント開示クイズ")}
          <div class="quiz-top">
            <span class="counter">第${qi + 1}問 / ${qs.length}</span>
            <span class="score-pill">${score}点</span>
          </div>
          <div class="progress-line"><span style="width:${(qi / qs.length) * 100}%"></span></div>
          <div class="panel">
            <div class="q-head">${U.catTag(t.cat)}${U.newTag(t)}<span class="q-title">この用語はなに？</span><span class="worth" id="worth">${POINTS[0]}点</span></div>
            <ol class="hint-list" id="hints"></ol>
            <button type="button" class="btn btn-ghost btn-block" id="more">ヒントをもう1つ見る（−10点）</button>
          </div>
          <div class="choices" id="choices">
            ${opts.map((o, k) => `<button type="button" class="choice" data-k="${k}">${U.esc(o.term)}</button>`).join("")}
          </div>
          <div id="feedback"></div>`;

        const hintsEl = root.querySelector("#hints"), more = root.querySelector("#more");
        function renderHints() {
          hintsEl.innerHTML = hints.map((h, k) =>
            k < shown ? `<li class="hint open"><span class="hint-no">ヒント${k + 1}</span>${U.esc(h)}</li>`
                      : `<li class="hint locked"><span class="hint-no">ヒント${k + 1}</span>？？？</li>`).join("");
          root.querySelector("#worth").textContent = answered ? "" : POINTS[shown - 1] + "点";
          more.hidden = shown >= 3 || answered;
        }
        renderHints();
        more.addEventListener("click", () => { if (shown < 3) { shown++; renderHints(); } });

        root.querySelector("#choices").addEventListener("click", e => {
          const b = e.target.closest(".choice");
          if (!b || answered) return;
          answered = true;
          const pick = opts[+b.dataset.k];
          const ok = pick.term === t.term;
          const gain = ok ? POINTS[shown - 1] : 0;
          score += gain;
          if (ok) ITP.store.correct(t.term); else ITP.store.wrong(t.term);
          log.push({ t, ok, gain });
          root.querySelectorAll(".choice").forEach((c, k) => {
            c.disabled = true;
            if (opts[k].term === t.term) c.classList.add("correct");
            else if (c === b) c.classList.add("wrong");
          });
          shown = 3; renderHints();
          root.querySelector(".score-pill").textContent = score + "点";
          const fb = root.querySelector("#feedback");
          fb.innerHTML = `
            <div class="feedback ${ok ? "fb-ok" : "fb-ng"}">
              <b>${ok ? `正解！ +${gain}点` : `ざんねん… 正解は「${U.esc(t.term)}」`}</b>
              <p>${U.esc(t.desc)}</p>
            </div>
            <button type="button" class="btn btn-primary btn-block" id="next">${qi + 1 < qs.length ? "次の問題へ" : "結果を見る"}</button>`;
          const nx = fb.querySelector("#next");
          nx.addEventListener("click", () => { qi++; qi < qs.length ? showQ() : finish(); });
          nx.focus({ preventScroll: true });
          fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
        });
      }

      function finish() {
        const max = qs.length * POINTS[0];
        const correct = log.filter(l => l.ok).length;
        const rec = qs.length === 10 && cat !== "review" && ITP.store.setBest("hint_" + ITP.mode, score, (a, b) => a > b);
        const wrongs = log.filter(l => !l.ok).map(l => l.t);
        root.innerHTML = `
          ${U.head("🔍", "ヒント開示クイズ")}
          <div class="panel result">
            ${rec && score > 0 ? `<div class="badge-new">ベストスコア更新！</div>` : ""}
            <div class="result-big">${score}<small> / ${max}点</small></div>
            <p class="result-sub">${qs.length}問中 ${correct}問正解</p>
            <div class="btn-row">
              <button type="button" class="btn btn-primary" id="again">もう一度</button>
              <button type="button" class="btn" id="change">設定を変える</button>
              <a class="btn btn-ghost" href="#/">ホームへ</a>
            </div>
          </div>
          <div class="panel"><h2>ふりかえり</h2>
            <ul class="term-list">${log.map(l => `<li class="${l.ok ? "" : "is-ng"}">${U.catTag(l.t.cat)}<b>${l.ok ? "○" : "×"} ${U.esc(l.t.term)}${l.ok ? `<em>+${l.gain}点</em>` : ""}</b><span>${U.esc(l.t.desc)}</span></li>`).join("")}</ul>
            ${wrongs.length ? `<p class="note">間違えた用語は復習リストに追加しました。</p>` : ""}
          </div>`;
        root.querySelector("#again").addEventListener("click", () => {
          const pool = U.termsFor(cat);
          if (!pool.length) { setup(); return; }
          play(U.pickWeighted(pool, n), cat, n);
        });
        root.querySelector("#change").addEventListener("click", () => { params = {}; setup(); });
      }

      showQ();
    }

    setup();
    return () => timers.forEach(clearTimeout);
  }
};

</script>
  <script>
/* ===== js/games/calc.js ===== */
/*
 * ⑧ 計算ミニゲーム
 *   2進数・稼働率・損益分岐点などの計算問題を4択でタイムアタック。
 */
window.ITP = window.ITP || {};
ITP.games = ITP.games || {};

ITP.games.calc = {
  title: "計算ミニゲーム",
  render(root, params) {
    const U = ITP.util;
    let tick = null;

    function pool(type) {
      if (type === "review") {
        const set = new Set(ITP.store.reviewCalc());
        return ITP.CALC.filter(c => set.has(c.id));
      }
      return type === "all" ? ITP.CALC.slice() : ITP.CALC.filter(c => c.type === type);
    }

    function setup() {
      const preset = params.type || "all";
      const rc = ITP.store.reviewCalc().length;
      const types = [["all", "すべて"], ...ITP.CALC_TYPES.map(t => [t, t]), ["review", `復習リスト (${rc})`]];
      const best = ITP.store.best("calc");
      root.innerHTML = `
        ${U.head("🧮", "計算ミニゲーム", "試験に出る計算問題を、テンポよく解いてみよう。紙とペンを用意するのがおすすめです。")}
        <div class="panel setup">
          <h2>問題の種類</h2>
          <div class="chips" data-group="type">
            ${types.map(([v, l]) => `<button type="button" class="chip ${v === preset ? "on" : ""} ${v === "review" ? "chip-review" : ""}" data-value="${v}">${l}${v !== "all" && v !== "review" ? ` (${pool(v).length})` : ""}</button>`).join("")}
          </div>
          <h2>問題数</h2>
          <div class="chips" data-group="n">
            <button type="button" class="chip on" data-value="5">5問</button>
            <button type="button" class="chip" data-value="10">10問</button>
          </div>
          <button type="button" class="btn btn-primary btn-block" id="start">スタート</button>
          <p class="note center">ベスト記録（すべて・10問）：<b>${best ? `${best.correct}問正解 / ${U.fmtTime(best.time)}` : "—"}</b></p>
        </div>`;
      const get = U.bindChips(root);
      root.querySelector("#start").addEventListener("click", () => {
        const type = get("type"), n = +get("n");
        const p = pool(type);
        if (!p.length) { U.toast("この種類には出題できる問題がありません"); return; }
        play(U.shuffle(p).slice(0, n), type, n);
      });
      if (params.start && pool(preset).length) play(U.shuffle(pool(preset)).slice(0, 10), preset, 10);
    }

    function play(qs, type, n) {
      let qi = 0, correct = 0;
      const log = [];
      const start = Date.now();
      clearInterval(tick);

      function showQ() {
        const q = qs[qi];
        const order = U.shuffle(q.choices.map((c, k) => k));
        root.innerHTML = `
          ${U.head("🧮", "計算ミニゲーム")}
          <div class="quiz-top">
            <span class="counter">第${qi + 1}問 / ${qs.length}</span>
            <span class="score-pill">⏱ <span id="c-time">${U.fmtTime((Date.now() - start) / 1000)}</span></span>
          </div>
          <div class="progress-line"><span style="width:${(qi / qs.length) * 100}%"></span></div>
          <div class="panel">
            <div class="q-head"><span class="tag tag-calc">${U.esc(q.type)}</span></div>
            <p class="calc-q">${U.esc(q.q)}</p>
          </div>
          <div class="choices" id="choices">
            ${order.map(k => `<button type="button" class="choice" data-k="${k}">${U.esc(q.choices[k])}</button>`).join("")}
          </div>
          <div id="feedback"></div>`;

        root.querySelector("#choices").addEventListener("click", e => {
          const b = e.target.closest(".choice");
          if (!b || b.disabled) return;
          const ok = +b.dataset.k === q.answer;
          if (ok) { correct++; ITP.store.calcCorrect(q.id); } else ITP.store.calcWrong(q.id);
          log.push({ q, ok });
          root.querySelectorAll(".choice").forEach(c => {
            c.disabled = true;
            if (+c.dataset.k === q.answer) c.classList.add("correct");
            else if (c === b) c.classList.add("wrong");
          });
          const fb = root.querySelector("#feedback");
          fb.innerHTML = `
            <div class="feedback ${ok ? "fb-ok" : "fb-ng"}">
              <b>${ok ? "正解！" : `ざんねん… 正解は「${U.esc(q.choices[q.answer])}」`}</b>
              <p>${U.esc(q.exp)}</p>
            </div>
            <button type="button" class="btn btn-primary btn-block" id="next">${qi + 1 < qs.length ? "次の問題へ" : "結果を見る"}</button>`;
          const nx = fb.querySelector("#next");
          nx.addEventListener("click", () => { qi++; qi < qs.length ? showQ() : finish(); });
          nx.focus({ preventScroll: true });
          fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
        });
      }

      tick = setInterval(() => {
        const el = root.querySelector("#c-time");
        if (el) el.textContent = U.fmtTime((Date.now() - start) / 1000);
      }, 500);

      function finish() {
        clearInterval(tick); tick = null;
        const time = (Date.now() - start) / 1000;
        const rec = type === "all" && qs.length === 10 &&
          ITP.store.setBest("calc", { correct, time }, (a, b) => a.correct > b.correct || (a.correct === b.correct && a.time < b.time));
        const rate = Math.round((correct / qs.length) * 100);
        root.innerHTML = `
          ${U.head("🧮", "計算ミニゲーム")}
          <div class="panel result">
            ${rec ? `<div class="badge-new">ベスト記録更新！</div>` : ""}
            <div class="result-big">${correct}<small> / ${qs.length}問</small></div>
            <p class="result-sub">正答率 ${rate}%・タイム ${U.fmtTime(time)}</p>
            <div class="btn-row">
              <button type="button" class="btn btn-primary" id="again">もう一度</button>
              <button type="button" class="btn" id="change">設定を変える</button>
              <a class="btn btn-ghost" href="#/">ホームへ</a>
            </div>
          </div>
          <div class="panel"><h2>ふりかえり</h2>
            <ul class="calc-log">${log.map(l => `
              <li class="${l.ok ? "" : "is-ng"}">
                <span class="cl-mark">${l.ok ? "○" : "×"}</span>
                <div><p>${U.esc(l.q.q)}</p><p class="cl-ans">答え：<b>${U.esc(l.q.choices[l.q.answer])}</b></p><p class="cl-exp">${U.esc(l.q.exp)}</p></div>
              </li>`).join("")}</ul>
            ${log.some(l => !l.ok) ? `<p class="note">間違えた問題は復習リストに追加しました。</p>` : ""}
          </div>`;
        root.querySelector("#again").addEventListener("click", () => {
          const p = pool(type);
          if (!p.length) { setup(); return; }
          play(U.shuffle(p).slice(0, n), type, n);
        });
        root.querySelector("#change").addEventListener("click", () => { params = {}; setup(); });
      }

      showQ();
    }

    setup();
    return () => clearInterval(tick);
  }
};

    const get = U.bindChips(root);
    const q = root.querySelector("#q"), list = root.querySelector("#list"), count = root.querySelector("#count");
    const norm = s => s.toLowerCase().normalize("NFKC");
    const sorted = ITP.TERMS.slice().sort((a, b) => a.term.localeCompare(b.term, "ja"));

    function draw() {
      const word = norm(q.value.trim());
      const lv = get("lv");
      const pool = new Set(U.termsFor(get("cat")).map(t => t.term));
      const hits = sorted.filter(t => {
        if (!pool.has(t.term)) return false;
        const L = ITP.store.level(t.term);
        if (lv === "todo" && L >= ITP.store.MASTER_LEVEL) return false;
        if (lv === "done" && L < ITP.store.MASTER_LEVEL) return false;
        return !word || norm(t.term).includes(word) || norm(t.desc).includes(word);
      });
      count.textContent = `${hits.length}語`;
      list.innerHTML = hits.length ? hits.map(t => {
        const L = ITP.store.level(t.term);
        return `<li>
          <div class="dl-head">${U.catTag(t.cat)}${U.newTag(t)}<b>${U.esc(t.term)}</b>
            <span class="lv lv-${Math.min(L, 2)}" title="${LV_LABEL[L]}" aria-label="${LV_LABEL[L]}">${"●".repeat(Math.min(L, 3))}${"○".repeat(3 - Math.min(L, 3))}</span>
          </div>
          <p>${U.esc(t.desc)}</p>
        </li>`;
      }).join("") : `<li class="dict-empty">見つかりませんでした。別の言葉で検索してみてください。</li>`;
    }

    q.addEventListener("input", draw);
    root.querySelectorAll(".chips").forEach(g => g.addEventListener("click", () => setTimeout(draw)));
    draw();
  }
};

</script>
  <!-- 画面切り替え・ホーム（最後に読み込む） -->
  <script>
/* ===== js/app.js ===== */
/*
 * 画面の切り替え（ルーター）とホーム画面
 */
window.ITP = window.ITP || {};
ITP.games = ITP.games || {};

(function () {
  const U = ITP.util;
  const app = document.getElementById("app");
  let cleanup = null;

  const GAME_LIST = [
    { key: "swipe", icon: "🃏", name: "スワイプ用語カード", desc: "知ってたら右、知らなかったら左。まずは用語と仲良くなろう", time: "3分" },
    { key: "memory", icon: "🧠", name: "神経衰弱マッチング", desc: "「用語」と「意味」のペアをそろえよう。タイムを縮めて記録更新", time: "2〜4分" },
    { key: "sort", icon: "📦", name: "3分野仕分けレース", desc: "60秒で、用語を試験の3分野に仕分けよう", time: "1分" },
    { key: "hint", icon: "🔍", name: "ヒント開示クイズ", desc: "ヒントが少ないうちに当てるほど高得点。推理でもOK", time: "3〜5分" },
    { key: "calc", icon: "🧮", name: "計算ミニゲーム", desc: "2進数・稼働率・損益分岐点など、頻出の計算問題に慣れよう", time: "5分" }
  ];

  function gauge(cat) {
    const c = ITP.CATS[cat], p = ITP.store.progress(cat), cls = c.color;
    const m = p.total ? (p.mastered / p.total) * 100 : 0;
    const l = p.total ? (p.learning / p.total) * 100 : 0;
    return `
      <div class="gauge">
        <div class="gauge-head"><span class="gauge-label ${cls}">${c.name}</span><span class="gauge-num"><b>${p.mastered}</b> / ${p.total}語</span></div>
        <div class="gauge-bar" role="img" aria-label="${c.name} 習得 ${p.mastered}語、学習中 ${p.learning}語、全${p.total}語">
          <span class="seg-m ${cls}" style="width:${m}%"></span><span class="seg-l ${cls}" style="width:${l}%"></span>
        </div>
      </div>`;
  }

  function modeSwitch() {
    return `
      <section class="panel mode-panel">
        <h2>試験の版を選ぶ</h2>
        <div class="mode-switch" role="radiogroup" aria-label="試験の版">
          ${Object.keys(ITP.MODES).map(k => {
            const m = ITP.MODES[k], on = k === ITP.mode;
            return `<button type="button" class="mode-opt ${on ? "on" : ""}" data-mode="${k}" role="radio" aria-checked="${on}">
              <span class="mode-name">${m.label}</span>
              <span class="mode-exam">${m.exam}</span>
              <span class="mode-cats">${Object.values(m.cats).map(c => `<span class="tag tag-${c.color}">${c.name}</span>`).join("")}</span>
            </button>`;
          }).join("")}
        </div>
        <p class="note">${ITP.mode === "next"
          ? `IPAの${ITP.MODES.next.basis}にもとづく内容です。正式版で変わる可能性があります。新シラバスで登場する用語には <span class="tag tag-new">NEW</span> が付きます。`
          : `${ITP.MODES.now.basis}にもとづく内容です。2026年度中に受験する人はこちら。`}</p>
      </section>`;
  }

  function renderHome() {
    const all = ITP.store.progress();
    const pct = all.total ? Math.round((all.mastered / all.total) * 100) : 0;
    const rc = ITP.store.reviewCount();
    const newCount = ITP.TERMS.filter(t => t.isNew).length;
    app.innerHTML = `
      <section class="hero">
        <p class="hero-kicker">ITパスポート対策</p>
        <h1>遊んでいるうちに、<br>用語が身につく。</h1>
        <p class="hero-sub">1回3分から。ログイン不要で、スマホでもPCでも遊べます。</p>
      </section>

      ${modeSwitch()}

      <section class="panel progress-panel">
        <div class="panel-head">
          <h2>あなたの進捗 <small class="muted">（${ITP.MODES[ITP.mode].label}）</small></h2>
          <span class="big-pct">${pct}<small>%</small></span>
        </div>
        ${Object.keys(ITP.CATS).map(gauge).join("")}
        <p class="legend"><span class="lg lg-m"></span>習得済み（2回以上正解）　<span class="lg lg-l"></span>学習中</p>
      </section>

      ${rc ? `<a class="review-banner" href="#/review">
        <span class="rb-icon">📝</span>
        <span><b>復習リストに ${rc} 件</b><br><small>間違えた用語・問題をまとめて復習しよう</small></span>
        <span class="rb-arrow">›</span></a>` : ""}

      <section>
        <h2 class="section-title">ゲームを選ぶ</h2>
        <div class="game-grid">
          ${GAME_LIST.map(g => `
            <a class="game-card" href="#/${g.key}">
              <span class="gc-icon" aria-hidden="true">${g.icon}</span>
              <span class="gc-body">
                <span class="gc-name">${g.name}</span>
                <span class="gc-desc">${g.desc}</span>
              </span>
              <span class="gc-time">${g.time}</span>
            </a>`).join("")}
          <a class="game-card game-card-dict" href="#/dict">
            <span class="gc-icon" aria-hidden="true">📖</span>
            <span class="gc-body">
              <span class="gc-name">用語辞典</span>
              <span class="gc-desc">全${ITP.TERMS.length}語を検索・分野別に一覧。覚えた度合いもひと目でわかる</span>
            </span>
          </a>
        </div>
      </section>

      <footer class="foot">
        <p>収録（${ITP.MODES[ITP.mode].label}）：用語 ${ITP.TERMS.length}語${newCount ? `（うち新シラバス用語 ${newCount}語）` : ""}／計算問題 ${ITP.CALC.length}問</p>
        <p>学習記録はこのブラウザにだけ保存され、両方の版で共通です。</p>
        <button type="button" class="link-btn" id="reset-btn">学習記録をリセット</button>
      </footer>`;

    app.querySelectorAll(".mode-opt").forEach(b => b.addEventListener("click", () => {
      if (b.dataset.mode === ITP.mode) return;
      ITP.setMode(b.dataset.mode);
      renderHome();
      updateChrome();
      U.toast(`${ITP.MODES[ITP.mode].label}に切り替えました`);
    }));
    document.getElementById("reset-btn").addEventListener("click", () => {
      if (confirm("進捗・復習リスト・ベスト記録をすべて消去します。よろしいですか？")) {
        ITP.store.reset();
        renderHome();
        U.toast("学習記録をリセットしました");
      }
    });
  }

  /** ヘッダーの表示（復習件数・現在の版） */
  function updateChrome() {
    const n = ITP.store.reviewCount();
    const b = document.getElementById("review-badge");
    b.textContent = n;
    b.hidden = n === 0;
    const chip = document.getElementById("mode-chip");
    chip.textContent = ITP.MODES[ITP.mode].short;
    chip.className = "mode-chip mode-" + ITP.mode;
  }
  ITP.store.onChange = updateChrome;

  function parseHash() {
    const h = location.hash.replace(/^#\/?/, "");
    const [path, query] = h.split("?");
    const params = {};
    (query || "").split("&").filter(Boolean).forEach(kv => {
      const [k, v] = kv.split("=");
      params[decodeURIComponent(k)] = decodeURIComponent(v || "");
    });
    return { path: path || "", params };
  }

  function route() {
    if (cleanup) { try { cleanup(); } catch (e) { } cleanup = null; }
    document.getElementById("toast").className = "";
    const { path, params } = parseHash();
    document.body.dataset.page = path || "home";
    window.scrollTo(0, 0);
    const mod = ITP.games[path];
    if (mod) {
      document.title = mod.title + "｜ITパス ゲームラボ";
      cleanup = mod.render(app, params) || null;
    } else {
      document.title = "ITパス ゲームラボ";
      renderHome();
    }
    updateChrome();
    app.focus({ preventScroll: true });
  }

  window.addEventListener("hashchange", route);
  route();
})();

</script>
